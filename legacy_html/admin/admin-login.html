<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Forbody</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forbody: { black: "#0A0A0A", red: "#E30613", silver: "#C0C0C0", darkgray: "#141414" }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-forbody-black text-white h-screen flex items-center justify-center antialiased">
  <div class="max-w-md w-full px-6">
    <div class="bg-forbody-darkgray p-8 rounded-2xl border border-white/10 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-forbody-red to-red-900 rounded-xl mx-auto flex items-center justify-center text-white font-black text-3xl mb-4 shadow-lg shadow-forbody-red/20">F</div>
        <h1 class="text-2xl font-bold">Admin Portal</h1>
        <p class="text-forbody-silver text-sm">Acesso restrito à equipe de marketing</p>
      </div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-forbody-silver mb-2">E-mail Corporativo</label>
          <input type="email" id="email" required class="w-full bg-forbody-black border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-forbody-red focus:ring-1 focus:ring-forbody-red transition-all" placeholder="marketing@forbody.com.br">
        </div>
        <div>
          <label class="block text-sm font-medium text-forbody-silver mb-2">Senha</label>
          <input type="password" id="password" required class="w-full bg-forbody-black border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-forbody-red focus:ring-1 focus:ring-forbody-red transition-all" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-forbody-red to-red-800 hover:from-red-600 hover:to-red-900 text-white font-bold py-3 rounded-lg transition-all flex items-center justify-center gap-2">
          <span>Acessar Painel</span>
          <i class="fas fa-sign-in-alt"></i>
        </button>
        <p id="errorMsg" class="text-red-500 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
